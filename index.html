<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>₹</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LumoPay - Financial Inclusion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .loader-badge {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #d97706, #f59e0b);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 36px;
        font-weight: 900;
        box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900 font-sans antialiased select-none">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-badge">₹</div>
        <h1 style="margin-top: 16px; font-size: 20px; font-weight: 800; color: #0f172a;">LumoPay</h1>
        <p style="margin-top: 4px; font-size: 12px; color: #64748b;">वित्तीय समावेशन साथी • Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
